# Build/publish only. Deployment is a separately approved manual cutover; see
# docs/deployment-durability.md. No metadata edits or whole-VM reset in CI.
steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/bot-of-culture:$BUILD_ID', '.']
images:
  - 'gcr.io/$PROJECT_ID/bot-of-culture:$BUILD_ID'
